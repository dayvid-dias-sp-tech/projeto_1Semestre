<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0E13">
    <title>SysKage | Criar conta</title>
    <link rel="stylesheet" href="./css/loginNinja.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
</head>
<body>
    <main class="pagina-login">
        <section class="painel-apresentacao" aria-label="Apresentação SysKage">
            <a class="marca" href="home.html" aria-label="SysKage, página inicial">
                <img class="logo-syskage" src="./assets/imgs/logo-syskage-header.png" alt="SysKage">
            </a>
            <div class="apresentacao-conteudo">
                <p class="chamada">Sua jornada começa aqui</p>
                <h1>Crie sua conta e explore o mundo ninja.</h1>
                <img class="imagem-destaque" src="./assets/imgs/naruto-home.png" alt="Naruto em Konoha">
                <p class="legenda"><span aria-hidden="true"></span>Uma conta para acompanhar sua jornada no SysKage.</p>
            </div>
        </section>

        <section class="painel-formulario" aria-labelledby="titulo-cadastro">
            <div class="formulario-conteudo">
                <h2 id="titulo-cadastro">Criar conta</h2>
                <p class="subtitulo">Use seus dados de acesso. Seu perfil ninja será preenchido depois.</p>

                <form class="formulario" id="form-cadastro-usuario" novalidate>
                    <label for="nome_input">Nome completo <span aria-hidden="true">*</span></label>
                    <input id="nome_input" name="nome" type="text" placeholder="Seu nome completo" autocomplete="name" required>

                    <label for="usuario_input">Nome de usuário <span aria-hidden="true">*</span></label>
                    <input id="usuario_input" name="usuario" type="text" placeholder="Como quer ser chamado" autocomplete="username" required>

                    <label for="email_input">E-mail <span aria-hidden="true">*</span></label>
                    <input id="email_input" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>

                    <label for="senha_input">Senha <span aria-hidden="true">*</span></label>
                    <div class="campo-senha">
                        <input id="senha_input" name="senha" type="password" placeholder="Crie uma senha" autocomplete="new-password" minlength="8" required>
                        <button class="alternar-senha" type="button" aria-label="Mostrar ou ocultar senha" onclick="alternarSenha(senha_input)">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                        </button>
                    </div>

                    <label for="confirmacao_senha_input">Confirmar senha <span aria-hidden="true">*</span></label>
                    <div class="campo-senha">
                        <input id="confirmacao_senha_input" name="confirmacaoSenha" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" minlength="8" required>
                        <button class="alternar-senha" type="button" aria-label="Mostrar ou ocultar confirmação de senha" onclick="alternarSenha(confirmacao_senha_input)">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                        </button>
                    </div>

                    <button class="botao-entrar" type="submit">Criar conta</button>
                    <p class="mensagem-erro" id="mensagem_erro" role="status" aria-live="polite"></p>
                </form>

                <p class="link-cadastro">Já possui uma conta? <a href="loginNinja.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <script>
        const formCadastro = document.getElementById("form-cadastro-usuario");
        const mensagemCadastro = document.getElementById("mensagem_erro");

        formCadastro.addEventListener("submit", function (evento) {
            evento.preventDefault();
            mensagemCadastro.textContent = "";
            mensagemCadastro.classList.remove("sucesso");

            if (!formCadastro.reportValidity()) return;

            if (senha_input.value !== confirmacao_senha_input.value) {
                mensagemCadastro.textContent = "As senhas não coincidem.";
                confirmacao_senha_input.focus();
                return;
            }

            mensagemCadastro.classList.add("sucesso");
            mensagemCadastro.textContent = "Os dados estão válidos. A criação da conta ainda precisa ser conectada ao serviço de autenticação.";
        });

        function alternarSenha(campo) {
            campo.type = campo.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
