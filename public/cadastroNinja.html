<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#192856">
    <title>SysKage | Cadastro da vila</title>
    <link rel="stylesheet" href="./css/cadastroNinja.css">
</head>
<body>
    <main class="pagina-login pagina-cadastro">
        <section class="painel-apresentacao" aria-label="Apresentação SysKage">
            <a class="marca" href="home.html" aria-label="SysKage, página inicial">
                <span class="marca-simbolo" aria-hidden="true">六</span>
                <span>SysKage</span>
            </a>

            <div class="apresentacao-conteudo">
                <p class="chamada">Estratégia. Liderança. Legado.</p>
                <h1>Construa o legado da sua vila.</h1>
                <img class="imagem-destaque" src="./assets/imgs/naruto-home.png" alt="Ilustração de personagens do universo ninja">
                <p class="legenda"><span aria-hidden="true"></span>Lidere sua vila. Comande seu destino.</p>
            </div>
        </section>

        <section class="painel-formulario" aria-labelledby="titulo-cadastro">
            <div class="formulario-conteudo">
                <h2 id="titulo-cadastro">Cadastre sua vila</h2>
                <p class="subtitulo">Crie sua conta administrativa e comece a organizar sua nação ninja.</p>

                <form class="formulario formulario-cadastro" onsubmit="return validarCadastro()">
                    <label for="vila_input">Nome da vila</label>
                    <input id="vila_input" name="vila" type="text" placeholder="Ex.: Vila do Horizonte" autocomplete="organization" required>

                    <label for="nacao_input">País ou nação</label>
                    <input id="nacao_input" name="nacao" type="text" placeholder="Ex.: País do Fogo" required>

                    <label for="responsavel_input">Nome completo do responsável</label>
                    <input id="responsavel_input" name="responsavel" type="text" placeholder="Ex.: Akira Tanaka" autocomplete="name" required>

                    <label for="email_input">E-mail</label>
                    <input id="email_input" name="email" type="email" placeholder="voce@suavila.com" autocomplete="email" required>

                    <label for="senha_input">Senha</label>
                    <div class="campo-senha">
                        <input id="senha_input" name="senha" type="password" placeholder="Crie uma senha segura" autocomplete="new-password" minlength="8" required>
                        <button class="alternar-senha" type="button" aria-label="Mostrar ou ocultar senha" onclick="alternarSenha(senha_input)">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                        </button>
                    </div>

                    <label for="confirmacao_senha_input">Confirme sua senha</label>
                    <div class="campo-senha">
                        <input id="confirmacao_senha_input" name="confirmacao_senha" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" minlength="8" required>
                        <button class="alternar-senha" type="button" aria-label="Mostrar ou ocultar confirmação de senha" onclick="alternarSenha(confirmacao_senha_input)">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                        </button>
                    </div>

                    <button class="botao-entrar" type="submit">Criar minha vila</button>
                    <p class="mensagem-erro" id="mensagem_erro" role="alert" aria-live="polite"></p>
                </form>

                <p class="link-cadastro">Já possui uma conta? <a href="loginNinja.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <script>
        function alternarSenha(campo) {
            if (campo.type == "password") {
                campo.type = "text";
            } else {
                campo.type = "password";
            }
        }

        function validarCadastro() {
            var senha = senha_input.value;
            var confirmacao = confirmacao_senha_input.value;
            mensagem_erro.innerHTML = "";

            if (senha !== confirmacao) {
                mensagem_erro.innerHTML = "As senhas não coincidem.";
                return false;
            }

            mensagem_erro.innerHTML = "O cadastro de novas vilas ainda não está disponível.";
            return false;
        }
    </script>
</body>
</html>
